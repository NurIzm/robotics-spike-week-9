<div class="prog" id="prog">
  <section class="prog__left" aria-label="Блоктардан құралған бағдарлама">
    <div class="tasks">
      <div class="tasks__tabs" id="task-tabs"></div>
      <p class="tasks__goal" id="task-goal"></p>
      <p class="tasks__hint" id="task-hint" hidden></p>
      <ol class="tasks__steps" id="task-steps" hidden></ol>
      <div class="tasks__row">
        <p class="tasks__status" id="task-status" role="status"></p>
        <div class="tasks__acts">
          <button type="button" class="tasks__act" id="task-hint-btn" aria-expanded="false">Кеңес</button>
          <button type="button" class="tasks__act" id="task-solution">Шешімін көрсету</button>
          <button type="button" class="tasks__act" id="task-reset">Үстелді қалпына келтіру</button>
          <button type="button" class="tasks__act" id="task-restart">Қайтадан бастау</button>
        </div>
      </div>
    </div>
    <div class="prog__ws">
      <div class="prog__blockly" id="prog-blockly"></div>
      <div class="prog__tools" id="prog-tools">
        <button type="button" data-tool="fit" aria-label="Барлық блокты көрсету" title="Барлық блокты көрсету">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l6 6m0-4.5V9H4.5M21 3l-6 6m0-4.5V9h4.5M3 21l6-6m0 4.5V15H4.5M21 21l-6-6m0 4.5V15h4.5"/></svg>
        </button>
        <button type="button" data-tool="out" aria-label="Кішірейту" title="Кішірейту">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"/><path d="M6.5 10.5h8M16 16l5.5 5.5"/></svg>
        </button>
        <button type="button" data-tool="in" aria-label="Үлкейту" title="Үлкейту">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"/><path d="M6.5 10.5h8M10.5 6.5v8M16 16l5.5 5.5"/></svg>
        </button>
        <span class="prog__toolgap"></span>
        <button type="button" data-tool="undo" aria-label="Болдырмау" title="Болдырмау">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5 4 9.5 8.5 14M4.5 9.5H15a5.5 5.5 0 0 1 0 11h-3"/></svg>
        </button>
        <button type="button" data-tool="redo" aria-label="Қайталау" title="Қайталау">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5 20 9.5 15.5 14M19.5 9.5H9a5.5 5.5 0 0 0 0 11h3"/></svg>
        </button>
      </div>
      <div class="prog__run">
        <button type="button" class="prog__round prog__round--stop" id="prog-stop" aria-label="Бағдарламаны тоқтату" title="Тоқтату">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
        </button>
        <button type="button" class="prog__round prog__round--play" id="prog-play" aria-label="Бағдарламаны іске қосу" title="Іске қосу">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.2v15.6a1 1 0 0 0 1.5.86l12.4-7.8a1 1 0 0 0 0-1.72L8.5 3.34A1 1 0 0 0 7 4.2z"/></svg>
        </button>
      </div>
    </div>
  </section>

  <div class="prog__split" id="prog-split" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Блоктар мен модель арасындағы шекара. Сол және оң нұсқар пернелері оны жылжытады."></div>

  <section class="prog__right" aria-label="Робот-қол моделі">
    <div class="prog__stage" id="prog-stage">
      <p class="prog__hud" id="prog-hud" hidden><b id="hud-time"></b><span id="hud-count"></span></p>
      <div class="pad" id="prog-pad" role="group" aria-label="Қолды жылжыту">
        <button type="button" data-move="-z" class="pad__up" aria-label="Алысырақ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5 5 16h14z"/></svg></button>
        <button type="button" data-move="-x" class="pad__left" aria-label="Солға"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12 16 5v14z"/></svg></button>
        <button type="button" data-move="+z" class="pad__down" aria-label="Жақынырақ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19 5 8h14z"/></svg></button>
        <button type="button" data-move="+x" class="pad__right" aria-label="Оңға"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12 8 5v14z"/></svg></button>
        <button type="button" data-move="+y" class="pad__lift" aria-label="Қолды көтеру">Жоғары</button>
        <button type="button" data-move="-y" class="pad__drop" aria-label="Қолды түсіру">Төмен</button>
      </div>
    </div>
    <div class="hubp">
      <div class="hubp__hub">
        <div class="hubp__leds" id="hub-leds" role="img" aria-label="Хаб экраны, 5 × 5 шам"></div>
        <div class="hubp__pill">
          <button type="button" id="hub-left" aria-label="Хабтың сол жақ батырмасы"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12l9-6v12z"/></svg></button>
          <button type="button" id="hub-center" class="hubp__center" aria-label="Ортаңғы батырма: іске қосу және тоқтату"></button>
          <button type="button" id="hub-right" aria-label="Хабтың оң жақ батырмасы"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 12 8 6v12z"/></svg></button>
        </div>
      </div>
      <div class="hubp__side">
        <div class="hubp__port">
          <p>F порты</p>
          <dl>
            <dt>Бұрыш</dt><dd><b id="read-angle">0</b> °</dd>
            <dt>Жылдамдық</dt><dd><b id="read-speed">0</b> %</dd>
            <dt>Қуат</dt><dd><b id="read-power">0</b> %</dd>
          </dl>
        </div>
        <button type="button" class="btn hubp__shake" id="hub-shake">Сілку</button>
        <p class="hubp__keys">Мотор тек саусақтарды қозғайды, қолды сен тасисың: <kbd>нұсқарлар</kbd> немесе <kbd>WASD</kbd>, <kbd>Q</kbd> <kbd>E</kbd> жоғары және төмен, болмаса модельді тінтуірмен сүйре. <kbd>Пробел</kbd> сол жақ батырманы басады.</p>
      </div>
    </div>
  </section>
</div>
